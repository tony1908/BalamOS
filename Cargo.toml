[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/orbit-client",
  "crates/orbit-daemon",
  "crates/orbit-domain",
  "crates/orbit-protocol",
  "crates/orbit-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
interprocess = { version = "2.4", features = ["tokio"] }
rusqlite = { version = "0.37", features = ["bundled", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
libc = "0.2"
rand = "0.9"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
keyring = { version = "3.6.3", default-features = false }
